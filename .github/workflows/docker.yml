name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# develop publishes the tested images as `next`. A release PR (into main,
# from this repository) publishes them as `candidate-<head commit>`; the
# release workflow later gives exactly those images their version tags.
env:
  PUBLISH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
  PUBLISH_TAG: ${{ github.event_name == 'pull_request' && format('candidate-{0}', github.event.pull_request.head.sha) || 'next' }}

# Pushes to a branch run one at a time, so an older develop run can never
# overwrite a newer `next` image. Superseded PR runs are cancelled.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.target }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # About 2.5 minutes with a warm cache; a cold build takes longer.
    timeout-minutes: 30

    # Each architecture builds and smoke-tests on a native runner, so no
    # image is ever tested under emulation.
    strategy:
      fail-fast: false
      matrix:
        target: [scirocco-server, kulfan-server]
        arch: [amd64, arm64]
        include:
          - target: scirocco-server
            image: chrislupp/scirocco
            dockerfile: docker/scirocco-server/Dockerfile
            kind: analysis
          - target: kulfan-server
            image: chrislupp/scirocco-kulfan
            dockerfile: docker/kulfan-server/Dockerfile
            kind: geometry
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      # A release PR builds its head commit, the commit its candidate tag
      # names; other PRs build GitHub's test merge as usual.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref == 'main' && github.event.pull_request.head.sha || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: scirocco-ci:${{ matrix.kind }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max

      - name: Install smoke-test client
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-client"
          "$RUNNER_TEMP/smoke-client/bin/pip" install philote-mdo==0.8.0

      - name: Smoke-test image and invalid-request recovery
        run: |
          export PATH="$RUNNER_TEMP/smoke-client/bin:$PATH"
          bash scripts/smoke_image.sh "scirocco-ci:${{ matrix.kind }}" "${{ matrix.kind }}"

      # Each runner pushes the image that just passed the smoke test by
      # digest only (no tag); the publish job tags the multi-arch manifest
      # once every image has passed.
      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same builder and inputs as the tested build, so every layer comes
      # from its cache and the pushed image is the one that was tested.
      - name: Push the tested image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}

      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.kind }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish (${{ matrix.image }})
    needs: build
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      matrix:
        include:
          - image: chrislupp/scirocco
            kind: analysis
          - image: chrislupp/scirocco-kulfan
            kind: geometry

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.kind }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:$PUBLISH_TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$PUBLISH_TAG"
