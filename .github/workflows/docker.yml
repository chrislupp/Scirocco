name: Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: scirocco-server
            image: chrislupp/scirocco
            dockerfile: docker/scirocco-server/Dockerfile
          - target: kulfan-server
            image: chrislupp/scirocco-kulfan
            dockerfile: docker/kulfan-server/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login only when we're going to push (tag pushes). Skipped for PRs and
      # branch builds, which only validate that the image builds.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            # Semver tags pushed by the release workflow (vX.Y.Z, vX.Y.Z-rc.N).
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # `latest` only for stable semver tags on main.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            # Branch builds (develop, main) get a moving tag for convenience.
            type=ref,event=branch
            # PR builds get a pr-N tag (not pushed, used for cache/labels only).
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Smoke-test image starts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          echo "Testing image: $IMAGE"
          docker run --rm -d --name smoke "$IMAGE"
          sleep 2
          docker ps --filter name=smoke --format '{{.Status}}' | grep -q '^Up' \
            || { docker logs smoke; exit 1; }
          docker stop smoke >/dev/null
