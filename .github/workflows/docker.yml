name: Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: scirocco-server
            image: chrislupp/scirocco
            dockerfile: docker/scirocco-server/Dockerfile
            port: 50051
            kind: analysis
          - target: kulfan-server
            image: chrislupp/scirocco-kulfan
            dockerfile: docker/kulfan-server/Dockerfile
            port: 50052
            kind: geometry

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            # PR builds get a pr-N tag (not pushed, used for cache/labels only).
            type=ref,event=pr

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      - name: Install smoke-test client
        run: |
          python3 -m venv "$RUNNER_TEMP/smoke-client"
          "$RUNNER_TEMP/smoke-client/bin/pip" install philote-mdo==0.8.0

      - name: Smoke-test image and invalid-request recovery
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          export PATH="$RUNNER_TEMP/smoke-client/bin:$PATH"
          bash scripts/smoke_image.sh "${IMAGE_TAGS%%$'\n'*}" "${{ matrix.kind }}"
