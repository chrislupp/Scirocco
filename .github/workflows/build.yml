name: Build and Tests

env:
  PHILOTE_CPP_REF: cd19666a23ddca009ee8b27ecdd40c0a0a2ea4b4

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  packaging:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Test release version progression
      run: python3 -m unittest discover -s scripts -p 'test_*.py'
    - name: Install core dependencies
      run: sudo apt-get update && sudo apt-get install -y libeigen3-dev
    - name: Build documented default and test installed consumer
      run: |
        cmake -S scirocco -B build-core -DCMAKE_BUILD_TYPE=Release -DSCIROCCO_NATIVE_ARCH=OFF
        cmake --build build-core -j2
        ctest --test-dir build-core -R InstalledConsumer --output-on-failure --no-tests=error

  python-reference:
    runs-on: ubuntu-24.04
    name: Python complex-step reference
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install reference dependencies
      run: python -m pip install numpy scipy matplotlib
    - name: Validate analytic extensions independently of C++
      run: python -m unittest discover -s mfoil -p 'test_*.py'

  format:
    runs-on: ubuntu-24.04

    name: Format

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format-17
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
        sudo apt-get install -y clang-format-17

    - name: Check Formatting
      run: |
        find scirocco/include scirocco/src scirocco/tests scirocco/examples \
          -name '*.h' -o -name '*.cpp' | \
          xargs clang-format-17 --dry-run --Werror

  clang-tidy:
    needs: [format]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    name: Clang-Tidy

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev clang-tidy-18 \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build Philote-Cpp
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_PHILOTE=ON
        -DPhiloteCpp_DIR=/tmp/philote-cpp/build
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_BUILD_EXAMPLES=OFF
        -DSCIROCCO_NATIVE_ARCH=OFF
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: >
        run-clang-tidy-18
        -p ${{github.workspace}}/build
        -header-filter='scirocco/include/'
        'scirocco/src/.*\.cpp$'

  build:
    needs: [format]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-14, cxx: g++-14, name: GCC 14 }
          - { cc: clang-18, cxx: clang++-18, name: Clang 18 }
        build_type: [Release]

    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }}

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
          python3-venv

    - name: Build Philote-Cpp
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)

    - name: Configure CMake (default suite)
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DSCIROCCO_BUILD_PHILOTE=ON
        -DPhiloteCpp_DIR=/tmp/philote-cpp/build
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_HDF5_OUTPUT=ON
        -DSCIROCCO_NATIVE_ARCH=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} -j$(nproc)

    - name: Tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Python tutorials (Philote-MDO 0.8.0)
      if: matrix.compiler.cc == 'gcc-14'
      run: |
        python3 -m venv "$RUNNER_TEMP/tutorial-venv"
        "$RUNNER_TEMP/tutorial-venv/bin/python" -m pip install \
          -r examples/tutorials/requirements.txt

        build/src/philote/scirocco_server localhost:50051 \
          >"$RUNNER_TEMP/scirocco-server.log" 2>&1 &
        ANALYSIS_PID=$!
        build/src/philote/scirocco_kulfan_server localhost:50052 \
          >"$RUNNER_TEMP/kulfan-server.log" 2>&1 &
        GEOMETRY_PID=$!
        trap 'kill "$ANALYSIS_PID" "$GEOMETRY_PID" 2>/dev/null || true' EXIT

        "$RUNNER_TEMP/tutorial-venv/bin/python" - <<'PY'
        import socket
        import time

        for port in (50051, 50052):
            for attempt in range(20):
                try:
                    with socket.create_connection(("localhost", port), timeout=1):
                        break
                except OSError:
                    if attempt == 19:
                        raise
                    time.sleep(0.5)
        PY

        "$RUNNER_TEMP/tutorial-venv/bin/python" \
          examples/tutorials/quickstart.py
        for tutorial in \
          examples/tutorials/01_inviscid_sweep.py \
          examples/tutorials/02_viscous_analysis.py \
          examples/tutorials/03_geometry_modifications.py \
          examples/tutorials/04_custom_airfoil.py \
          examples/tutorials/05_sensitivities.py
        do
          "$RUNNER_TEMP/tutorial-venv/bin/python" "$tutorial"
        done

        "$RUNNER_TEMP/tutorial-venv/bin/python" \
          examples/tutorials/06_hdf5_history.py \
          --history-file "$RUNNER_TEMP/tutorial-history.h5"
        kill "$ANALYSIS_PID"
        wait "$ANALYSIS_PID" || true
        "$RUNNER_TEMP/tutorial-venv/bin/python" \
          examples/tutorials/read_hdf5_history.py \
          "$RUNNER_TEMP/tutorial-history.h5"

  build-debug-suite:
    needs: [format]
    runs-on: ubuntu-24.04

    name: GCC 14 / Release / Sensitivity-Debug Suite

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build Philote-Cpp
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)

    - name: Configure CMake (chain-piece debug tests + probes)
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_PHILOTE=ON
        -DPhiloteCpp_DIR=/tmp/philote-cpp/build
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_BUILD_SENSITIVITY_DEBUG_TESTS=ON
        -DSCIROCCO_BUILD_PROBES=ON
        -DSCIROCCO_NATIVE_ARCH=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release -j$(nproc)

    - name: Tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

  coverage:
    needs: [format]
    runs-on: ubuntu-24.04
    # The job takes a few minutes. Cap it so a slow regression fails the job
    # instead of holding the PR for half an hour.
    timeout-minutes: 15

    name: Coverage

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev llvm-18 \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build Philote-Cpp
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_PHILOTE=ON
        -DPhiloteCpp_DIR=/tmp/philote-cpp/build
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_NATIVE_ARCH=OFF
        -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j$(nproc)

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      env:
        LLVM_PROFILE_FILE: ${{github.workspace}}/build/coverage-%p.profraw
      # Chain-piece debug tests run in build-debug-suite; the default suite
      # already exercises their production paths through end-to-end gradients.
      # Every test takes under 3 s instrumented; the per-test limit names the
      # culprit if one becomes slow. InstalledConsumer runs in the packaging
      # job: its separate build lacks the coverage flags and cannot link the
      # instrumented library.
      run: >
        ctest --output-on-failure --no-tests=error
        --parallel $(nproc) --timeout 60 -E '^InstalledConsumer$'

    - name: Generate Coverage Report
      run: |
        llvm-profdata-18 merge -sparse ${{github.workspace}}/build/coverage-*.profraw -o coverage.profdata
        TEST_BINS=$(find ${{github.workspace}}/build -type f -executable -name 'scirocco_*' | sed '1!s/^/-object /')
        llvm-cov-18 export -format=lcov -instr-profile=coverage.profdata $TEST_BINS \
          -ignore-filename-regex='(_deps|tests/|examples/|/usr/|server\.cpp)' > coverage.info

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
