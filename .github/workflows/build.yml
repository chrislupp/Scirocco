name: Build and Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format:
    runs-on: ubuntu-24.04

    name: Format

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format-17
      run: |
        wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
        sudo apt-get install -y clang-format-17

    - name: Check Formatting
      run: |
        find scirocco/include scirocco/src scirocco/tests scirocco/examples \
          -name '*.h' -o -name '*.cpp' | \
          xargs clang-format-17 --dry-run --Werror

  clang-tidy:
    needs: [format]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    name: Clang-Tidy

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev clang-tidy-18 \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build and Install Philote-Cpp
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/chrislupp/Philote-Cpp.git /tmp/philote-cpp
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)
        sudo cmake --install /tmp/philote-cpp/build

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_BUILD_EXAMPLES=OFF
        -DSCIROCCO_NATIVE_ARCH=OFF
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run clang-tidy
      run: >
        run-clang-tidy-18
        -p ${{github.workspace}}/build
        -header-filter='scirocco/include/'
        'scirocco/src/.*\.cpp$'

  build:
    needs: [format]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-14, cxx: g++-14, name: GCC 14 }
          - { cc: clang-18, cxx: clang++-18, name: Clang 18 }
        build_type: [Release]

    name: ${{ matrix.compiler.name }} / ${{ matrix.build_type }}

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build and Install Philote-Cpp
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/chrislupp/Philote-Cpp.git /tmp/philote-cpp
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)
        sudo cmake --install /tmp/philote-cpp/build

    - name: Configure CMake (default suite)
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_NATIVE_ARCH=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build_type }} -j$(nproc)

    - name: Tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

  build-debug-suite:
    needs: [format]
    runs-on: ubuntu-24.04

    name: GCC 14 / Release / Sensitivity-Debug Suite

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build and Install Philote-Cpp
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/chrislupp/Philote-Cpp.git /tmp/philote-cpp
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)
        sudo cmake --install /tmp/philote-cpp/build

    - name: Configure CMake (chain-piece debug tests + probes)
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_BUILD_SENSITIVITY_DEBUG_TESTS=ON
        -DSCIROCCO_BUILD_PROBES=ON
        -DSCIROCCO_NATIVE_ARCH=OFF

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release -j$(nproc)

    - name: Tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure

  coverage:
    needs: [format]
    runs-on: ubuntu-24.04

    name: Coverage

    env:
      CC: clang-18
      CXX: clang++-18

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev llvm-18 \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc

    - name: Build and Install Philote-Cpp
      run: |
        git clone --depth 1 --recurse-submodules https://github.com/chrislupp/Philote-Cpp.git /tmp/philote-cpp
        cmake -B /tmp/philote-cpp/build -S /tmp/philote-cpp \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j$(nproc)
        sudo cmake --install /tmp/philote-cpp/build

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -S ${{github.workspace}}/scirocco
        -DCMAKE_BUILD_TYPE=Release
        -DSCIROCCO_BUILD_TESTS=ON
        -DSCIROCCO_NATIVE_ARCH=OFF
        -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

    - name: Build
      run: cmake --build ${{github.workspace}}/build -j$(nproc)

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      env:
        LLVM_PROFILE_FILE: ${{github.workspace}}/build/coverage-%p.profraw
      run: >
        ctest --output-on-failure
        -R "^(SplineTest|GeometryTest|MfoilReference|Philote)"

    - name: Generate Coverage Report
      run: |
        llvm-profdata-18 merge -sparse ${{github.workspace}}/build/coverage-*.profraw -o coverage.profdata
        TEST_BINS=$(find ${{github.workspace}}/build -type f -executable -name 'scirocco_*' | sed '1!s/^/-object /')
        llvm-cov-18 export -format=lcov -instr-profile=coverage.profdata $TEST_BINS \
          -ignore-filename-regex='(_deps|tests/|examples/|/usr/|server\.cpp)' > coverage.info

    - name: Upload to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.info
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

