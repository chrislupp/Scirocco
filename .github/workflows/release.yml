name: Release

# A release PR comes from scripts/prepare_release.sh: a release/<tag> branch
# into main that already holds every versioned change (CMake version,
# CHANGELOG, docs snapshot, screenshots). While it is open, the PR's own CI
# builds and tests that exact commit, the Docker workflow publishes its
# images as candidate-<head commit>, and the "Release check" job below
# confirms the release is complete and the publishing credentials work.
#
# After the merge nothing is rebuilt. The jobs tag the merge commit, give
# the candidate images their version tags, create the GitHub release,
# update the Homebrew tap, merge main back into develop and check the
# published artifacts. Each job skips work already done, so any of them
# can be rerun.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    branches: [main]

concurrency:
  group: ${{ github.event.action == 'closed' && 'scirocco-release' || format('release-check-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read

env:
  RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  # ── Before the merge ─────────────────────────────────────────────
  check:
    name: Release check
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    - name: Require a release PR
      run: |
        if ! jq -e 'index("release") or index("prerelease")' <<<"$RELEASE_LABELS" >/dev/null; then
          echo "::error::A PR into main must be a release PR (labels release or prerelease). Use scripts/prepare_release.sh."
          exit 1
        fi

    # The merge commit then has exactly this tree, so what was tested here
    # is what is tagged.
    - name: Require main to be merged in
      run: |
        git fetch origin main
        git merge-base --is-ancestor origin/main HEAD || {
          echo "::error::The release branch does not contain main. Run: git merge origin/main"
          exit 1
        }

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Test the release scripts
      run: |
        python -m pip install pyyaml
        python -m unittest discover -s scripts -p 'test_*.py'

    - name: Check the prepared release
      run: python3 scripts/release_plan.py check --base origin/main

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Build the docs as released
      run: |
        npm --prefix docs ci
        npm --prefix docs run typecheck
        npm --prefix docs run build

    # A dry-run push asks the server for push access without sending
    # anything, so it tests the token itself, not its owner's rights.
    - name: Check publishing credentials
      env:
        RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        test -n "$RELEASE_TOKEN" || { echo "::error::RELEASE_TOKEN is not set"; exit 1; }
        for repo in "$GITHUB_REPOSITORY" chrislupp/homebrew-tools; do
          git push --dry-run \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${repo}.git" \
            HEAD:refs/heads/release-token-check > /dev/null 2>&1 ||
            { echo "::error::RELEASE_TOKEN cannot push to $repo"; exit 1; }
        done
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        docker logout

  # ── After the merge ──────────────────────────────────────────────
  tag:
    name: Tag
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag_version }}
      header: ${{ steps.plan.outputs.changelog_header }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Require the merge to ship the tested tree
      run: git diff --quiet "$HEAD_SHA" HEAD

    - name: Work out the tag
      id: plan
      run: python3 scripts/release_plan.py check --base HEAD^1

    - uses: docker/setup-buildx-action@v3

    - name: Require the tested images
      run: |
        for image in chrislupp/scirocco chrislupp/scirocco-kulfan; do
          docker buildx imagetools inspect "$image:candidate-$HEAD_SHA" > /dev/null || {
            echo "::error::$image:candidate-$HEAD_SHA is missing; rerun the Docker workflow on the release PR"
            exit 1
          }
        done

    - name: Push the tag
      if: steps.plan.outputs.tag_exists == 'false'
      env:
        TAG: ${{ steps.plan.outputs.tag_version }}
      run: |
        bash scripts/release_gpg.sh
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "refs/tags/$TAG"

  images:
    name: Tag images
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Give the tested images their version tags
      env:
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        version="${TAG#v}"
        tags=("$version")
        if [[ "$version" != *-* ]]; then
          tags+=("${version%.*}" "${version%%.*}" latest)
        fi
        for image in chrislupp/scirocco chrislupp/scirocco-kulfan; do
          args=()
          for t in "${tags[@]}"; do args+=(-t "$image:$t"); done
          docker buildx imagetools create "${args[@]}" "$image:candidate-$HEAD_SHA"
          docker buildx imagetools inspect "$image:$version"
        done

  github-release:
    name: GitHub release
    needs: [tag, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.tag.outputs.tag }}

    - name: Create the release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        TAG: ${{ needs.tag.outputs.tag }}
        HEADER: ${{ needs.tag.outputs.header }}
        PRERELEASE: ${{ needs.tag.outputs.is_prerelease }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists"
          exit 0
        fi
        python3 scripts/release_plan.py notes "$HEADER" > "$RUNNER_TEMP/notes.md"
        flags=()
        if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
        gh release create "$TAG" --verify-tag --title "$TAG" \
          --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"

  # Points the scirocco and fauxfoil formulae in chrislupp/homebrew-tools at
  # a stable release.
  homebrew:
    name: Homebrew
    needs: [tag, github-release]
    if: needs.tag.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.tag.outputs.tag }}

    - uses: actions/checkout@v4
      with:
        repository: chrislupp/homebrew-tools
        token: ${{ secrets.RELEASE_TOKEN }}
        path: homebrew-tools

    - name: Update and push the formulae
      env:
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        python3 scripts/homebrew_formula.py "$TAG" \
          homebrew-tools/Formula/scirocco.rb homebrew-tools/Formula/fauxfoil.rb
        cd homebrew-tools
        if git diff --quiet; then
          echo "Formulae already point at $TAG"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Update Scirocco and fauXFOIL to ${TAG#v}"
        git push origin HEAD

  merge-back:
    name: Merge main into develop
    needs: [tag, github-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Merge
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        TAG: ${{ needs.tag.outputs.tag }}
      run: |
        bash scripts/release_gpg.sh
        git fetch origin main
        if git merge-base --is-ancestor origin/main HEAD; then
          echo "develop already contains main"
        elif git merge origin/main --no-edit; then
          git push origin HEAD:develop
        else
          git merge --abort
          echo "::warning::main does not merge cleanly into develop; opening a PR."
          gh pr create --base develop --head main \
            --title "Merge release $TAG back into develop" \
            --body "The release workflow could not merge main into develop without conflicts."
        fi

  verify:
    name: Check published artifacts
    needs: [tag, images, github-release]
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
