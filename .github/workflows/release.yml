name: Release

# A merged release PR publishes. An open one runs the release job as a dry
# run: the same version bump, CHANGELOG and docs snapshot, commit and
# validation, plus a check of the publishing credentials, but no tag, push
# or publication. A release PR must not merge until "Release dry run" passes.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
    branches: [main]

# Serialize version calculation, commit, and tag publication. Dry runs of a
# PR replace each other and never wait on a publication.
concurrency:
  group: ${{ github.event.action == 'closed' && 'scirocco-release' || format('scirocco-release-dry-run-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  release:
    name: ${{ github.event.action == 'closed' && 'Release' || 'Release dry run' }}
    if: >
      (github.event.action != 'closed' ||
       github.event.pull_request.merged == true) &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ github.event.action != 'closed' }}
    outputs:
      tag_version: ${{ steps.version.outputs.tag_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
    # ── Checkout ──────────────────────────────────────────────────────
    # A dry run checks out GitHub's test merge of the PR into main, with
    # the default token: it never pushes.
    - name: Checkout merged candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
        fetch-depth: 0
        token: ${{ github.event.action == 'closed' && secrets.RELEASE_TOKEN || github.token }}

    - name: Require candidate to be current main
      if: env.DRY_RUN == 'false'
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"
        git checkout -B main "$CANDIDATE"

    - name: Use the test merge as main
      if: env.DRY_RUN == 'true'
      run: git checkout -B main HEAD

    # The later jobs need these; check them before anything is published.
    - name: Check publishing credentials
      if: env.DRY_RUN == 'true'
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        test -n "$GH_TOKEN" || { echo "::error::RELEASE_TOKEN is not set"; exit 1; }
        # A dry-run push asks the server for push access without sending
        # anything, so it tests the token itself, not its owner's rights.
        for repo in "$GITHUB_REPOSITORY" chrislupp/homebrew-tools; do
          git push --dry-run \
            "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" \
            HEAD:refs/heads/release-token-check > /dev/null 2>&1 ||
            { echo "::error::RELEASE_TOKEN cannot push to $repo"; exit 1; }
        done
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        docker logout

    # ── GPG setup for signed commits ─────────────────────────────────
    - name: Generate ephemeral GPG key
      run: bash scripts/release_gpg.sh

    - name: Calculate and validate release version
      id: version
      env:
        RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: python3 scripts/release_version.py

    # ── Update CMakeLists.txt version ────────────────────────────────
    - name: Update CMakeLists.txt version
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        sed -i 's/\(VERSION\s\+\)[0-9]\+\.[0-9]\+\.[0-9]\+/\1'"$NEW_VERSION"'/' scirocco/CMakeLists.txt

        echo "CMakeLists.txt updated:"
        grep "project(scirocco" scirocco/CMakeLists.txt

    # ── Update CHANGELOG.md ──────────────────────────────────────────
    - name: Update CHANGELOG.md
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${{ steps.version.outputs.new_version }}"
        DATE=$(date +%Y-%m-%d)
        REPO="https://github.com/${{ github.repository }}"

        if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
          HEADER="${TAG#v}"
        else
          HEADER="${VERSION}"
        fi

        # Replace [Unreleased] header with version header and add new [Unreleased]
        sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${HEADER}] - ${DATE}/" CHANGELOG.md

        # Update comparison links
        sed -i '/^\[Unreleased\]:/d' CHANGELOG.md

        # Add new links at the bottom
        echo "[Unreleased]: ${REPO}/compare/${TAG}...HEAD" >> CHANGELOG.md
        echo "[${HEADER}]: ${REPO}/releases/tag/${TAG}" >> CHANGELOG.md

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Install docs snapshot dependencies
      if: steps.version.outputs.is_prerelease == 'false'
      run: npm --prefix docs ci

    - name: Prepare docs release snapshot
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
      run: python3 scripts/release_docs.py "$RELEASE_VERSION" "$IS_PRERELEASE"

    # Include the snapshot in the exact revision validated before publication.
    # ── Commit and tag ───────────────────────────────────────────────
    - name: Commit release changes
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${TAG#v}"

        git add scirocco/CMakeLists.txt CHANGELOG.md
        git add docs/docusaurus.config.ts docs/versions.json
        if [ "${{ steps.version.outputs.is_prerelease }}" = "false" ]; then
          git add docs/versioned_docs docs/versioned_sidebars
        fi
        git commit -S -m "chore: release version ${VERSION}"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install validation dependencies
      run: |
        # Same as .github/actions/apt-setup, inlined because this job checks
        # out a tree that may predate that action.
        grep -rl packages.microsoft.com /etc/apt/sources.list.d 2>/dev/null \
          | xargs -r sudo rm -f
        printf '%s\n' 'Acquire::Retries "3";' \
          'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
          | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
        python3 -m pip install numpy scipy matplotlib philote-mdo==0.8.0

    - name: Build pinned Philote-Cpp
      env:
        PHILOTE_CPP_REF: 49e1b42c3e46a4b9b70619c29e705985a6e6555d
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -S /tmp/philote-cpp -B /tmp/philote-cpp/build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j2

    - name: Validate prepared commit
      env:
        PHILOTE_CPP_DIR: /tmp/philote-cpp/build
        # The images job builds and tests the images on both architectures.
        VALIDATE_IMAGES: '0'
      run: bash scripts/validate_release.sh

    - name: Refuse publication if tracked files changed
      run: git diff --exit-code HEAD

    - name: Refuse publication if main advanced
      if: env.DRY_RUN == 'false'
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"

    - name: Create annotated tag
      if: env.DRY_RUN == 'false'
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        git tag -a "$TAG" -m "Release ${TAG}"

    # Nothing is pushed yet: the images job builds the images from this
    # bundle, and the publish job pushes it once every image has passed.
    - name: Bundle the release commit and tag
      if: env.DRY_RUN == 'false'
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
        TAG: ${{ steps.version.outputs.tag_version }}
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        git bundle create "$RUNNER_TEMP/release/release.bundle" \
          "refs/tags/$TAG" "^$CANDIDATE"

    - name: Upload the release bundle
      if: env.DRY_RUN == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: release-bundle
        path: ${{ runner.temp }}/release/release.bundle
        if-no-files-found: error
        retention-days: 7

  # ── Release images ───────────────────────────────────────────────
  # Build and smoke-test both images on native amd64 and arm64 runners from
  # the prepared release commit, then push each by digest only. No tag
  # moves until the publish job, so a failure here publishes nothing.
  images:
    name: Images (${{ matrix.kind }}, ${{ matrix.arch }})
    needs: release
    if: github.event.action == 'closed'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        kind: [analysis, geometry]
        arch: [amd64, arm64]
        include:
          - kind: analysis
            image: chrislupp/scirocco
            dockerfile: docker/scirocco-server/Dockerfile
          - kind: geometry
            image: chrislupp/scirocco-kulfan
            dockerfile: docker/kulfan-server/Dockerfile
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
    - name: Checkout merged candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Download the release bundle
      uses: actions/download-artifact@v4
      with:
        name: release-bundle
        path: ${{ runner.temp }}/release

    - name: Check out the prepared release commit
      env:
        TAG: ${{ needs.release.outputs.tag_version }}
      run: |
        git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/$TAG:refs/tags/$TAG"
        git checkout --detach "$TAG^{commit}"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build local image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/${{ matrix.arch }}
        push: false
        load: true
        tags: scirocco-release:${{ matrix.kind }}

    - name: Install smoke-test client
      run: |
        python3 -m venv "$RUNNER_TEMP/smoke-client"
        "$RUNNER_TEMP/smoke-client/bin/pip" install philote-mdo==0.8.0

    - name: Smoke-test image and invalid-request recovery
      run: |
        export PATH="$RUNNER_TEMP/smoke-client/bin:$PATH"
        bash scripts/smoke_image.sh "scirocco-release:${{ matrix.kind }}" "${{ matrix.kind }}"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Same builder and inputs as the tested build, so every layer comes from
    # its local cache and the pushed image is the one that was tested.
    - name: Push the tested image by digest
      id: push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: linux/${{ matrix.arch }}
        outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

    - name: Record the digest
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: release-digests-${{ matrix.kind }}-${{ matrix.arch }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 7

  # ── Publish ──────────────────────────────────────────────────────
  # Push the validated commit and tag, tag the multi-arch image manifests,
  # create the GitHub release and merge main back into develop.
  publish:
    needs: [release, images]
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout merged candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Download the release bundle
      uses: actions/download-artifact@v4
      with:
        name: release-bundle
        path: ${{ runner.temp }}/release

    # Signs the merge commit if main has to be merged back into develop.
    - name: Generate ephemeral GPG key
      run: bash scripts/release_gpg.sh

    - name: Check out the prepared release commit
      env:
        TAG: ${{ needs.release.outputs.tag_version }}
      run: |
        git fetch "$RUNNER_TEMP/release/release.bundle" "refs/tags/$TAG:refs/tags/$TAG"
        git checkout -B main "$TAG^{commit}"

    - name: Refuse publication if main advanced
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"
        test "$(git rev-parse HEAD^)" = "$CANDIDATE"

    - name: Push commit and tag
      run: |
        git push --atomic \
          --force-with-lease=refs/heads/main:${{ github.event.pull_request.merge_commit_sha }} \
          origin HEAD:refs/heads/main "${{ needs.release.outputs.tag_version }}"

    - name: Download the image digests
      uses: actions/download-artifact@v4
      with:
        path: ${{ runner.temp }}/digests
        pattern: release-digests-*

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Tag the tested multi-arch images
      working-directory: ${{ runner.temp }}/digests
      env:
        VERSION: ${{ needs.release.outputs.tag_version }}
      run: |
        version="${VERSION#v}"
        tags=("$version")
        if [[ "$version" != *-* ]]; then
          tags+=("${version%.*}" "${version%%.*}" latest)
        fi
        for kind in analysis geometry; do
          image=chrislupp/scirocco
          if [[ "$kind" == geometry ]]; then image=chrislupp/scirocco-kulfan; fi
          sources=()
          for arch in amd64 arm64; do
            digests=(release-digests-"$kind-$arch"/*)
            test "${#digests[@]}" -eq 1
            sources+=("$image@sha256:$(basename "${digests[0]}")")
          done
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(-t "$image:$tag"); done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$version"
        done

    # ── Extract release notes ────────────────────────────────────────
    - name: Extract release notes
      id: notes
      run: |
        TAG="${{ needs.release.outputs.tag_version }}"
        VERSION="${TAG#v}"

        # Extract the section for this version from CHANGELOG.md
        NOTES=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]")) found=1
            next
          }
          found { print }
        ' CHANGELOG.md)

        # Write to file for the release action
        echo "$NOTES" > /tmp/release-notes.md
        echo "Release notes:"
        cat /tmp/release-notes.md

    # ── Create GitHub Release ────────────────────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.release.outputs.tag_version }}
        name: ${{ needs.release.outputs.tag_version }}
        body_path: /tmp/release-notes.md
        prerelease: ${{ needs.release.outputs.is_prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    # ── Merge back to develop ───────────────────────────────────────
    - name: Merge main back to develop
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        git fetch origin develop
        git checkout develop

        if git merge main --no-edit; then
          git push origin develop
          echo "Successfully merged main back to develop"
        else
          git merge --abort
          echo "::warning::Auto-merge failed due to conflicts. Creating PR."
          gh pr create \
            --base develop \
            --head main \
            --title "chore: merge release ${{ needs.release.outputs.tag_version }} back to develop" \
            --body "Automatic merge of release changes back to develop failed due to conflicts. Please resolve manually."
        fi

  # ── Homebrew formula ─────────────────────────────────────────────
  # Point the scirocco and fauxfoil formulae in chrislupp/homebrew-tools at
  # the new stable release. A separate job, so a failure here leaves the
  # published release intact; rerun it once fixed. RELEASE_TOKEN must be
  # able to push to the tap.
  homebrew:
    needs: [release, publish]
    if: >
      github.event.action == 'closed' &&
      needs.release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.release.outputs.tag_version }}

    - name: Checkout Homebrew tap
      uses: actions/checkout@v4
      with:
        repository: chrislupp/homebrew-tools
        token: ${{ secrets.RELEASE_TOKEN }}
        path: homebrew-tools

    - name: Update and push the formulae
      env:
        TAG: ${{ needs.release.outputs.tag_version }}
      run: |
        python3 scripts/homebrew_formula.py "$TAG" \
          homebrew-tools/Formula/scirocco.rb homebrew-tools/Formula/fauxfoil.rb
        cd homebrew-tools
        if git diff --quiet; then
          echo "Formulae already point at $TAG"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Update Scirocco and fauXFOIL to ${TAG#v}"
        git push origin HEAD
