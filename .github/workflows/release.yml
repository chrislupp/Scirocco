name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

# Serialize version calculation, commit, and tag publication.
concurrency:
  group: scirocco-release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-24.04
    outputs:
      tag_version: ${{ steps.version.outputs.tag_version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
    # ── Checkout ──────────────────────────────────────────────────────
    - name: Checkout merged candidate
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.merge_commit_sha }}
        fetch-depth: 0
        token: ${{ secrets.RELEASE_TOKEN }}

    - name: Require candidate to be current main
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"
        git checkout -B main "$CANDIDATE"

    # ── GPG setup for signed commits ─────────────────────────────────
    - name: Generate ephemeral GPG key
      run: |
        cat > /tmp/gpg-key-params <<GPGEOF
        %no-protection
        Key-Type: RSA
        Key-Length: 4096
        Subkey-Type: RSA
        Subkey-Length: 4096
        Name-Real: github-actions[bot]
        Name-Email: 41898282+github-actions[bot]@users.noreply.github.com
        Expire-Date: 1d
        GPGEOF
        gpg --batch --gen-key /tmp/gpg-key-params
        KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2)
        echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"

        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config user.signingkey "${KEY_ID}"
        git config commit.gpgsign true
        git config tag.gpgsign true

    - name: Calculate and validate release version
      id: version
      env:
        RELEASE_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      run: python3 scripts/release_version.py

    # ── Update CMakeLists.txt version ────────────────────────────────
    - name: Update CMakeLists.txt version
      run: |
        NEW_VERSION="${{ steps.version.outputs.new_version }}"
        sed -i 's/\(VERSION\s\+\)[0-9]\+\.[0-9]\+\.[0-9]\+/\1'"$NEW_VERSION"'/' scirocco/CMakeLists.txt

        echo "CMakeLists.txt updated:"
        grep "project(scirocco" scirocco/CMakeLists.txt

    # ── Update CHANGELOG.md ──────────────────────────────────────────
    - name: Update CHANGELOG.md
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${{ steps.version.outputs.new_version }}"
        DATE=$(date +%Y-%m-%d)
        REPO="https://github.com/${{ github.repository }}"

        if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
          HEADER="${TAG#v}"
        else
          HEADER="${VERSION}"
        fi

        # Replace [Unreleased] header with version header and add new [Unreleased]
        sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${HEADER}] - ${DATE}/" CHANGELOG.md

        # Update comparison links
        sed -i '/^\[Unreleased\]:/d' CHANGELOG.md

        # Add new links at the bottom
        echo "[Unreleased]: ${REPO}/compare/${TAG}...HEAD" >> CHANGELOG.md
        echo "[${HEADER}]: ${REPO}/releases/tag/${TAG}" >> CHANGELOG.md

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Install docs snapshot dependencies
      if: steps.version.outputs.is_prerelease == 'false'
      run: npm --prefix docs ci

    - name: Prepare docs release snapshot
      env:
        RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
      run: python3 scripts/release_docs.py "$RELEASE_VERSION" "$IS_PRERELEASE"

    # Include the snapshot in the exact revision validated before publication.
    # ── Commit and tag ───────────────────────────────────────────────
    - name: Commit release changes
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${TAG#v}"

        git add scirocco/CMakeLists.txt CHANGELOG.md
        git add docs/docusaurus.config.ts docs/versions.json
        if [ "${{ steps.version.outputs.is_prerelease }}" = "false" ]; then
          git add docs/versioned_docs docs/versioned_sidebars
        fi
        git commit -S -m "chore: release version ${VERSION}"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install validation dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libeigen3-dev libgtest-dev libhdf5-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler protobuf-compiler-grpc
        python3 -m pip install numpy scipy matplotlib philote-mdo==0.8.0

    - name: Build pinned Philote-Cpp
      env:
        PHILOTE_CPP_REF: 49e1b42c3e46a4b9b70619c29e705985a6e6555d
      run: |
        git clone --recurse-submodules https://github.com/MDO-Standards/Philote-Cpp.git /tmp/philote-cpp
        git -C /tmp/philote-cpp checkout "$PHILOTE_CPP_REF"
        git -C /tmp/philote-cpp submodule update --init --recursive
        cmake -S /tmp/philote-cpp -B /tmp/philote-cpp/build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
        cmake --build /tmp/philote-cpp/build -j2

    - name: Validate prepared commit and both release images
      env:
        PHILOTE_CPP_DIR: /tmp/philote-cpp/build
      run: bash scripts/validate_release.sh

    - name: Refuse publication if main advanced or tracked files changed
      env:
        CANDIDATE: ${{ github.event.pull_request.merge_commit_sha }}
      run: |
        git diff --exit-code HEAD
        git fetch origin main
        test "$(git rev-parse origin/main)" = "$CANDIDATE"

    - name: Create annotated tag
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        git tag -a "$TAG" -m "Release ${TAG}"

    - name: Push commit and tag
      run: |
        git push --atomic \
          --force-with-lease=refs/heads/main:${{ github.event.pull_request.merge_commit_sha }} \
          origin HEAD:refs/heads/main "${{ steps.version.outputs.tag_version }}"

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publish the tested images without rebuilding
      env:
        VERSION: ${{ steps.version.outputs.tag_version }}
      run: |
        version="${VERSION#v}"
        tags=("$version")
        if [[ "$version" != *-* ]]; then
          tags+=("${version%.*}" "${version%%.*}" latest)
        fi
        for kind in analysis geometry; do
          image=chrislupp/scirocco
          if [[ "$kind" == geometry ]]; then image=chrislupp/scirocco-kulfan; fi
          for tag in "${tags[@]}"; do
            docker tag "scirocco-release:$kind" "$image:$tag"
            docker push "$image:$tag"
          done
        done

    # ── Extract release notes ────────────────────────────────────────
    - name: Extract release notes
      id: notes
      run: |
        TAG="${{ steps.version.outputs.tag_version }}"
        VERSION="${TAG#v}"

        # Extract the section for this version from CHANGELOG.md
        NOTES=$(awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]")) found=1
            next
          }
          found { print }
        ' CHANGELOG.md)

        # Write to file for the release action
        echo "$NOTES" > /tmp/release-notes.md
        echo "Release notes:"
        cat /tmp/release-notes.md

    # ── Create GitHub Release ────────────────────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag_version }}
        name: ${{ steps.version.outputs.tag_version }}
        body_path: /tmp/release-notes.md
        prerelease: ${{ steps.version.outputs.is_prerelease }}
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    # ── Merge back to develop ───────────────────────────────────────
    - name: Merge main back to develop
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        git fetch origin develop
        git checkout develop

        if git merge main --no-edit; then
          git push origin develop
          echo "Successfully merged main back to develop"
        else
          git merge --abort
          echo "::warning::Auto-merge failed due to conflicts. Creating PR."
          gh pr create \
            --base develop \
            --head main \
            --title "chore: merge release ${{ steps.version.outputs.tag_version }} back to develop" \
            --body "Automatic merge of release changes back to develop failed due to conflicts. Please resolve manually."
        fi

  # ── Homebrew formula ─────────────────────────────────────────────
  # Point the scirocco and fauxfoil formulae in chrislupp/homebrew-tools at
  # the new stable release. A separate job, so a failure here leaves the
  # published release intact; rerun it once fixed. RELEASE_TOKEN must be
  # able to push to the tap.
  homebrew:
    needs: release
    if: needs.release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout release tag
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.release.outputs.tag_version }}

    - name: Checkout Homebrew tap
      uses: actions/checkout@v4
      with:
        repository: chrislupp/homebrew-tools
        token: ${{ secrets.RELEASE_TOKEN }}
        path: homebrew-tools

    - name: Update and push the formulae
      env:
        TAG: ${{ needs.release.outputs.tag_version }}
      run: |
        python3 scripts/homebrew_formula.py "$TAG" \
          homebrew-tools/Formula/scirocco.rb homebrew-tools/Formula/fauxfoil.rb
        cd homebrew-tools
        if git diff --quiet; then
          echo "Formulae already point at $TAG"
          exit 0
        fi
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -am "Update Scirocco and fauXFOIL to ${TAG#v}"
        git push origin HEAD
