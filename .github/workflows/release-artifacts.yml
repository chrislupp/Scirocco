name: Published release artifacts
# The release workflow calls this once a release is published (a
# `release: published` trigger never fired for releases the workflow made).
# Run it by hand to recheck an existing release.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify (for example v0.2.0-rc.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  artifacts:
    name: Install the released source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag and require an existing published release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft == false' | grep -qx true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install consumer dependencies
        run: |
          # Same as .github/actions/apt-setup, inlined because this job checks
          # out a tree that may predate that action.
          grep -rl packages.microsoft.com /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -f
          printf '%s\n' 'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev
      - name: Build released source archive and test a relocated install
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$RELEASE_TAG" > "$RUNNER_TEMP/source.tar.gz"
          mkdir "$RUNNER_TEMP/released-source"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/released-source"
          cmake -S "$RUNNER_TEMP/released-source/scirocco" -B "$RUNNER_TEMP/released-build" \
            -DCMAKE_BUILD_TYPE=Release -DSCIROCCO_NATIVE_ARCH=OFF -DSCIROCCO_BUILD_PHILOTE=OFF
          cmake --build "$RUNNER_TEMP/released-build" -j2
          ctest --test-dir "$RUNNER_TEMP/released-build" -R '^InstalledConsumer$' --output-on-failure --no-tests=error
  images:
    name: Exercise published images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag and require an existing published release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft == false' | grep -qx true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Python client
        run: python3 -m pip install philote-mdo==0.8.0
      - name: Pull this architecture's images and test Python connectivity and recovery
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for kind in analysis geometry; do
            image=chrislupp/scirocco
            port=50051
            if [[ "$kind" == geometry ]]; then
              image=chrislupp/scirocco-kulfan
              port=50052
            fi
            docker buildx imagetools inspect "$image:$version"
            docker pull --platform "linux/${{ matrix.arch }}" "$image:$version"
            docker image inspect "$image:$version" --format '{{json .RepoDigests}}'
            test "$(docker image inspect "$image:$version" --format '{{.Architecture}}')" = "${{ matrix.arch }}"
            container=$(docker run --rm -d -p "127.0.0.1::$port" "$image:$version")
            trap 'docker logs "$container"; docker stop "$container" >/dev/null 2>&1 || true' EXIT
            address=$(docker port "$container" "$port/tcp")
            python3 scripts/smoke_server.py --address "$address" --kind "$kind"
            docker stop "$container"
            trap - EXIT
          done
